.sc-controls {
  position: absolute;
  left: 50%;
  bottom: max(12px, env(safe-area-inset-bottom));
  transform: translateX(-50%);
  z-index: 20;
  display: flex;
  align-items: center;
  gap: 10px;
  width: min(560px, calc(100% - 24px));
  padding: 8px 12px;
  border: 1px solid var(--sc-line, #3b3b3b);
  border-radius: 10px;
  background: color-mix(in srgb, var(--sc-bg, #0a0a0a) 82%, transparent);
  color: var(--sc-text, #f2f2f2);
  font-family: var(--sc-font-mono, ui-monospace, monospace);
  font-size: 12px;
  line-height: 1;
  backdrop-filter: blur(8px);
}
.sc-controls__toggle {
  flex: 0 0 auto;
  appearance: none;
  border: 0;
  border-radius: 6px;
  padding: 7px 10px;
  background: var(--sc-text, #f2f2f2);
  color: var(--sc-bg, #0a0a0a);
  font: inherit;
  font-weight: 600;
  letter-spacing: 0.04em;
  cursor: pointer;
  min-width: 58px;
}
.sc-controls__toggle:focus-visible,
.sc-controls__range:focus-visible {
  outline: 2px solid var(--sc-accent, #ff5100);
  outline-offset: 2px;
}
.sc-controls__timeline {
  position: relative;
  flex: 1 1 auto;
  min-width: 60px;
  height: 24px;
  display: flex;
  align-items: center;
}
.sc-controls__beats {
  position: absolute;
  inset: 4px 0 auto;
  height: 8px;
  pointer-events: none;
}
.sc-controls__beat {
  position: absolute;
  top: 0;
  height: 8px;
  min-width: 2px;
  border-radius: 2px;
  background: var(--sc-accent, #ff5100);
  opacity: 0.55;
}
.sc-controls__beat--range {
  background: var(--sc-accent, #ff5100);
  opacity: 0.22;
}
.sc-controls__range {
  position: relative;
  z-index: 1;
  width: 100%;
  margin: 0;
  accent-color: var(--sc-accent, #ff5100);
  cursor: pointer;
}
.sc-controls__time {
  flex: 0 0 auto;
  font-variant-numeric: tabular-nums;
  color: var(--sc-muted, #8e8e8e);
  white-space: nowrap;
}
.sc-player__replay--with-controls {
  bottom: 64px;
